/* ============================================================
   2. GENERACION DE DATOS SIMULADOS (realistas / no oficiales)
   ============================================================ */
function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return (h % 1000) / 1000;
}

const BASE = {
  banco: { morosidad: 4.1, roe: 17.5, roa: 2.1, capital: 14.6, credBase: 32000, tamMult: 1 },
  cmac: { morosidad: 6.6, roe: 11.5, roa: 1.8, capital: 15.6, credBase: 3400, tamMult: 1 },
  crac: { morosidad: 11.2, roe: 4.2, roa: 0.6, capital: 17.4, credBase: 340, tamMult: 1 },
  financiera: { morosidad: 7.4, roe: 9.4, roa: 1.3, capital: 16.1, credBase: 1500, tamMult: 1 },
};

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function buildEntitySeries(name, tipo, idxInGroup) {
  const b = BASE[tipo];
  const seedBase = hash(name);
  const sizeFactor = 0.45 + hash(name + "size") * 1.6; // dispersión de tamaño entre entidades
  return YEARS.map((year) => {
    const t = year - 2015;
    const covid = year === 2020 ? 1 : year === 2021 ? 0.45 : 0;
    const stress24 = year === 2024 ? 1 : year === 2023 ? 0.3 : year === 2025 ? 0.35 : 0;
    const seed = hash(name + year) - 0.5;

    let morosidad = b.morosidad + covid * 2.6 + stress24 * 1.3 + seed * 1.6 - t * 0.035;
    morosidad = clamp(morosidad, 0.9, tipo === "crac" ? 22 : 14);

    let roe = b.roe - covid * 9 - stress24 * 5.5 + seed * 5 + t * 0.15;
    if (tipo === "crac") roe -= 2; // más volátil / a veces negativo
    roe = clamp(roe, tipo === "crac" ? -12 : -4, 28);

    let roa = b.roa - covid * 1.1 - stress24 * 0.6 + seed * 0.6 + t * 0.01;
    roa = clamp(roa, tipo === "crac" ? -1.8 : -0.6, 4.5);

    let capital = b.capital + seed * 1.2 - covid * 0.3 + t * 0.02;
    capital = clamp(capital, 11, 24);

    const growth = Math.pow(1.058 + seed * 0.02, t); // crecimiento nominal de cartera
    const creditos = Math.round(b.credBase * sizeFactor * growth * (1 - covid * 0.04));
    const depositos = Math.round(creditos * (0.85 + hash(name + "dep") * 0.35));

    return { year, morosidad: +morosidad.toFixed(2), roe: +roe.toFixed(2), roa: +roa.toFixed(2), capital: +capital.toFixed(2), creditos, depositos };
  });
}

function useSystemData() {
  return useMemo(() => {
    const data = {};
    Object.entries(ENTIDADES).forEach(([tipo, names]) => {
      data[tipo] = {};
      names.forEach((n, i) => {
        data[tipo][n] = buildEntitySeries(n, tipo, i);
      });
    });
    return data;
  }, []);
}

  const [desempleo, setDesempleo] = useState(7.5);

  const tiposDisponibles = tipoFiltro === "todos" ? Object.keys(ENTIDADES) : [tipoFiltro];

  const entidadesDisponibles = useMemo(() => {
    let list = [];
    tiposDisponibles.forEach((t) => list.push(...ENTIDADES[t].map((n) => ({ nombre: n, tipo: t }))));
    return list;
  }, [tipoFiltro]);

  const yearsInRange = YEARS.filter((y) => y >= yearRange[0] && y <= yearRange[1]);

  function toggleEntidad(nombre) {
    setSelectedEntidades((prev) =>
      prev.includes(nombre) ? prev.filter((n) => n !== nombre) : prev.length >= 5 ? prev : [...prev, nombre]
    );
  }

  function findTipoOf(nombre) {
    for (const t of Object.keys(ENTIDADES)) if (ENTIDADES[t].includes(nombre)) return t;
    return null;
  }

  // ---- Universo de KPIs: entidades seleccionadas, o si no hay ninguna, todas las del tipo filtrado ----
  const kpiScope = useMemo(() => {
    const names = selectedEntidades.length ? selectedEntidades : entidadesDisponibles.map((e) => e.nombre);
    return names.filter((n) => tiposDisponibles.includes(findTipoOf(n)));
  }, [selectedEntidades, tipoFiltro]);

  function scopeAverageAt(year, field) {
    const scope = kpiScope.length ? kpiScope : entidadesDisponibles.map((e) => e.nombre);
    if (!scope.length) return 0;
    let sum = 0, n = 0;
    scope.forEach((name) => {
      const tipo = findTipoOf(name);
      const row = data[tipo][name].find((r) => r.year === year);
      if (row) { sum += row[field]; n++; }
    });
    return n ? sum / n : 0;
  }
  function scopeSumAt(year, field) {
    const scope = kpiScope.length ? kpiScope : entidadesDisponibles.map((e) => e.nombre);
    let sum = 0;
    scope.forEach((name) => {
      const tipo = findTipoOf(name);
      const row = data[tipo][name].find((r) => r.year === year);
      if (row) sum += row[field];
    });
    return sum;
  }

  const lastYear = yearRange[1];
  const prevYear = Math.max(yearRange[0], lastYear - 1);
  const projFactor = viewMode === "predictivo" ? 1 : 0; // simple proyección +1 año

  const kpi = {
    morosidad: { v: scopeAverageAt(lastYear, "morosidad") + projFactor * 0.15, prev: scopeAverageAt(prevYear, "morosidad") },
    roe: { v: scopeAverageAt(lastYear, "roe") - projFactor * 0.4, prev: scopeAverageAt(prevYear, "roe") },
    capital: { v: scopeAverageAt(lastYear, "capital") + projFactor * 0.1, prev: scopeAverageAt(prevYear, "capital") },
    creditos: { v: scopeSumAt(lastYear, "creditos") * (1 + projFactor * 0.045), prev: scopeSumAt(prevYear, "creditos") },
  };

  // ---- Series para gráficos históricos ----
  const lineSeries = yearsInRange.map((year) => {
    const row = { year };
    (selectedEntidades.length ? selectedEntidades : entidadesDisponibles.slice(0, 3).map((e) => e.nombre)).forEach((name) => {
      const tipo = findTipoOf(name);
      const r = data[tipo][name].find((d) => d.year === year);
      row[name + "_morosidad"] = r ? r.morosidad : null;
      row[name + "_roe"] = r ? r.roe : null;
    });
    return row;
  });

  const barSeries = (selectedEntidades.length ? selectedEntidades : entidadesDisponibles.slice(0, 5).map((e) => e.nombre)).map((name) => {
    const tipo = findTipoOf(name);
    const r = data[tipo][name].find((d) => d.year === lastYear);
    return { name, creditos: r ? r.creditos : 0, depositos: r ? r.depositos : 0 };
  });

  const treemapData = Object.keys(ENTIDADES).map((tipo) => ({
    name: TIPOS.find((t) => t.id === tipo).label,
    children: ENTIDADES[tipo].map((n) => {
      const r = data[tipo][n].find((d) => d.year === lastYear);
      return { name: n, size: r ? r.creditos : 1, color: TIPOS.find((t) => t.id === tipo).color };
    }),
  }));

  // ---- Modelo predictivo ----
  const startMorosidad = scopeAverageAt(lastYear, "morosidad");
  const sensRate = 0.42, sensGdp = 0.5, sensUnemp = 0.3;
  const projMeses = [3, 6, 9, 12, 15, 18, 21, 24];
  const projData = projMeses.map((m) => {
    const drift = (m / 24) * (sensRate * (tasaRef - 4.75) + sensUnemp * (desempleo - 7.5) - sensGdp * (pbi - 2.5));
    const base = clamp(startMorosidad + drift, 0.8, 22);
    const optimista = clamp(base - (0.3 + m * 0.035), 0.5, 22);
    const pesimista = clamp(base + (0.3 + m * 0.055), 0.5, 24);
    return { mes: `M${m}`, optimista, base: +base.toFixed(2), pesimista, banda: [+optimista.toFixed(2), +pesimista.toFixed(2)] };
  });

  // ---- Predicción SEP2026 REAL (outputs/interfaz/predicciones_SEP2026_*.xlsx, vía scripts/run_prediccion.py) ----
  // Esta sección NUNCA calcula una predicción: solo lee y presenta REAL_PREDICCIONES_SEP2026,
  // que ya viene resuelta por el motor (ver scripts/actualizar_interfaz.py).
  const REAL_TIPO_LABEL = { BANCO: "Bancos", CMAC: "Cajas Municipales", CRAC: "Cajas Rurales", FINANCIERA: "Financieras" };
  const RATING_MASTER_SCALE = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E"];
  function realRatingTone(r) {
    if (!r) return { bg: C.chipBg, fg: C.slateSoft };
    const i = RATING_MASTER_SCALE.indexOf(r);
    if (i === -1) return { bg: C.chipBg, fg: C.slateSoft }; // RET / NR / token inválido
    if (i <= 2) return { bg: C.emeraldSoft, fg: C.emerald };       // A+, A, A-
    if (i <= 5) return { bg: C.amberSoft, fg: C.amber };           // B+, B, B-
    if (i <= 8) return { bg: C.amberSoft, fg: "#9A5A12" };         // C+, C, C-
    return { bg: C.crimsonSoft, fg: C.crimson };                    // D+, D, D-, E
  }

  const predTiposDisponibles = useMemo(() =>
    [...new Set(REAL_PREDICCIONES_SEP2026.map((r) => r.ENTITY_TYPE))].sort(), []);
  const predEntidadesDisponibles = useMemo(() => {
    const scope = predTipoEntidad === "TODOS" ? REAL_PREDICCIONES_SEP2026 : REAL_PREDICCIONES_SEP2026.filter((r) => r.ENTITY_TYPE === predTipoEntidad);
    return [...new Set(scope.map((r) => r.ENTITY_NAME))].sort();
  }, [predTipoEntidad]);

  const predFiltradas = useMemo(() => {
    let rows = REAL_PREDICCIONES_SEP2026;
    if (predTipoEntidad !== "TODOS") rows = rows.filter((r) => r.ENTITY_TYPE === predTipoEntidad);
    if (predTipoEntidad !== "TODOS" && predEntidad !== "TODAS") rows = rows.filter((r) => r.ENTITY_NAME === predEntidad);
    return rows;
  }, [predTipoEntidad, predEntidad]);

  // Pivot: una fila por entidad, con el rating anterior/predicho de cada ECR (N/D si esa ECR nunca calificó a la entidad)
  const predPivot = useMemo(() => {
    const porEntidad = {};
    predFiltradas.forEach((r) => {
      if (!porEntidad[r.ENTITY_NAME]) porEntidad[r.ENTITY_NAME] = { ENTITY_NAME: r.ENTITY_NAME, ENTITY_TYPE: r.ENTITY_TYPE, ecr: {} };
      porEntidad[r.ENTITY_NAME].ecr[r.ECR] = r;
    });
    return Object.values(porEntidad).sort((a, b) => a.ENTITY_NAME.localeCompare(b.ENTITY_NAME));
  }, [predFiltradas]);

  const predKpi = useMemo(() => {
    const entidadesUnicas = new Set(predFiltradas.map((r) => r.ENTITY_NAME));
    const mejora = predFiltradas.filter((r) => r.CAMBIO_ORDINAL < 0).length;
    const estable = predFiltradas.filter((r) => r.CAMBIO_ORDINAL === 0).length;
    const deterioro = predFiltradas.filter((r) => r.CAMBIO_ORDINAL > 0).length;
    const alertas = predFiltradas.filter((r) => r.ALERTA_DOWNGRADE_FUERTE).length;
    return { entidades: entidadesUnicas.size, mejora, estable, deterioro, alertas };
  }, [predFiltradas]);

  // ---- Modelos de Predicción: comparación de los 4 modelos reales del motor ----
  const modelosOrdenados = useMemo(() => {
    return Object.entries(REAL_RESUMEN_MODELOS)
      .map(([id, m]) => ({ id, ...m, ganadasEnECR: REAL_ECRS_CON_METRICAS.filter((ecr) => REAL_GANADOR_POR_ECR[ecr] === id).length }))
      .sort((a, b) => (b.puntaje_promedio ?? -1) - (a.puntaje_promedio ?? -1));
  }, []);
  const ganadorGeneralId = modelosOrdenados[0]?.id;

  const chartPuntajePorModelo = modelosOrdenados.map((m) => ({ modelo: m.label, puntaje: m.puntaje_promedio ?? 0 }));

  const chartMetricasPorModelo = ["1-HistGB", "2-MLPOrdinal", "3-RegresionOrdinal", "4-LightGBM"].map((id) => {
    const puntos = REAL_ECRS_CON_METRICAS.map((ecr) => REAL_METRICAS_POR_ECR[ecr].modelos[id]).filter(Boolean);
    const avg = (campo) => puntos.length ? puntos.reduce((s, p) => s + (p[campo] ?? 0), 0) / puntos.length : null;
    return {
      modelo: REAL_MODELOS_LABEL[id],
      "Weighted Kappa": _round2(avg("weighted_kappa")),
      "F1 macro": _round2(avg("f1_macro")),
      "MAE ordinal": _round2(avg("mae_ordinal")),
    };
  });
  function _round2(v) { return v == null ? 0 : Math.round(v * 100) / 100; }

  const chartPorECR = REAL_ECRS_CON_METRICAS.map((ecr) => {
    const ganador = REAL_GANADOR_POR_ECR[ecr];
    const puntaje = REAL_METRICAS_POR_ECR[ecr].modelos[ganador]?.puntaje ?? 0;
    return { ecr, puntaje, ganador: REAL_MODELOS_LABEL[ganador] || ganador };
  });

  const tiposEvento = [...new Set(REAL_EVENTOS_INTERVENCION.map((i) => i.TIPO_EVENTO))];
  const eventosFiltrados = causalFiltro === "todas" ? REAL_EVENTOS_INTERVENCION : REAL_EVENTOS_INTERVENCION.filter((i) => i.TIPO_EVENTO === causalFiltro);
  const TIPO_EVENTO_LABEL = {
    INTERVENCION_Y_LIQUIDACION: "Intervención y liquidación",
    INTERVENCION: "Intervención",
    DISOLUCION_VOLUNTARIA: "Disolución voluntaria",
  };
  const eventoSeleccionado = REAL_EVENTOS_INTERVENCION.find((e) => e.ENTITY_NAME_NORM === entidadIntervenidaSel) || REAL_EVENTOS_INTERVENCION[0];
  const ecrsConHistorial = eventoSeleccionado ? [...new Set(eventoSeleccionado.historial.flatMap((p) => Object.keys(p).filter((k) => k !== "corte")))] : [];
  const RATING_MASTER_SCALE_INT = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E"];
  const serieEventoSeleccionado = eventoSeleccionado ? eventoSeleccionado.historial.map((p) => {
    const fila = { corte: p.corte };
    ecrsConHistorial.forEach((ecr) => { fila[ecr] = p[ecr]?.valido ? p[ecr].ordinal : null; });
    return fila;
  }) : [];
  const ECR_LINE_COLOR = { APOYO: C.navyText, CLASS: C.gold, JCR: C.emerald, MICRORATE: C.crimson, MOODYS: "#6D5BD0", PCR: C.amber };

  return (
    <div className="w-full min-h-full" style={{ background: C.paper, fontFamily: "system-ui, -apple-system, sans-serif" }}>
      {/* HEADER */}
      <div style={{ background: C.navy }} className="px-6 py-5">
        <div className="flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 flex items-center justify-center border" style={{ borderColor: C.gold }}>
              <Landmark size={18} color={C.gold} />
            </div>
            <div>
              <h1 className="text-xl text-white font-semibold" style={{ fontFamily: serif }}>Panel de Estabilidad del Sistema Financiero Peruano</h1>
              <p className="text-xs" style={{ color: "#9AA9C4" }}>Indicadores simulados con fines ilustrativos, en base a la metodología y variables reportadas por la SBS · {yearRange[0]}–{yearRange[1]}</p>
            </div>
          </div>
          <button onClick={() => setDarkMode((d) => !d)}
            className="flex items-center gap-2 px-3 py-1.5 text-xs font-medium border shrink-0"
            style={{ borderColor: C.gold, color: C.gold }}>
            {darkMode ? <Sun size={14} /> : <Moon size={14} />}
            {darkMode ? "Modo claro" : "Modo oscuro"}
          </button>
        </div>
      </div>

      {/* FILTROS GLOBALES */}
      <div className=" border-b px-6 py-4" style={{ background: C.panel, borderColor: C.line }}>
        <div className="flex flex-wrap items-end gap-6">
          {/* Rango de años */}
          <div className="min-w-[220px]">
            <div className="flex items-center gap-1.5 mb-2 text-[11px] uppercase tracking-wide font-medium" style={{ color: C.slateSoft }}>
              <CalendarRange size={13} /> Rango de años
            </div>
            <div className="flex items-center gap-2">
              <input type="range" min={2015} max={2026} value={yearRange[0]}
                onChange={(e) => setYearRange([Math.min(+e.target.value, yearRange[1]), yearRange[1]])}
                className="w-20 accent-current" style={{ color: C.navyText }} />
              <span className="text-sm font-medium tabular-nums" style={{ color: C.navyText }}>{yearRange[0]}</span>
              <span style={{ color: C.slateSoft }}>–</span>
              <input type="range" min={2015} max={2026} value={yearRange[1]}
                onChange={(e) => setYearRange([yearRange[0], Math.max(+e.target.value, yearRange[0])])}
                className="w-20 accent-current" style={{ color: C.navyText }} />
              <span className="text-sm font-medium tabular-nums" style={{ color: C.navyText }}>{yearRange[1]}</span>
            </div>
          </div>

          {/* Tipo de entidad */}
          <div>
            <div className="flex items-center gap-1.5 mb-2 text-[11px] uppercase tracking-wide font-medium" style={{ color: C.slateSoft }}>
              <Filter size={13} /> Tipo de entidad
            </div>
            <div className="flex gap-1.5 flex-wrap">
              <Chip active={tipoFiltro === "todos"} onClick={() => setTipoFiltro("todos")}>Todas</Chip>
              {TIPOS.map((t) => (
                <Chip key={t.id} active={tipoFiltro === t.id} color={t.color} onClick={() => setTipoFiltro(t.id)}>{t.label}</Chip>
              ))}
            </div>
          </div>

          {/* Entidad especifica (multi) */}
          <div className="relative">
            <div className="flex items-center gap-1.5 mb-2 text-[11px] uppercase tracking-wide font-medium" style={{ color: C.slateSoft }}>
              <Building2 size={13} /> Entidades a comparar
            </div>
            <button onClick={() => setEntityPickerOpen((o) => !o)}
              className="flex items-center gap-2 px-3 py-1.5 border text-sm" style={{ background: C.panel, borderColor: C.line, color: C.navyText }}>
              {selectedEntidades.length ? `${selectedEntidades.length} seleccionadas` : "Todas las del filtro"}
              <ChevronDown size={14} />
            </button>
            {entityPickerOpen && (
              <div className="absolute z-20 mt-1 w-72 max-h-72 overflow-y-auto border shadow-md p-2" style={{ background: C.panel, borderColor: C.line }}>
                {entidadesDisponibles.map((e) => (
                  <label key={e.nombre} className="flex items-center gap-2 px-2 py-1.5 text-sm cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" checked={selectedEntidades.includes(e.nombre)} onChange={() => toggleEntidad(e.nombre)} />
                    <span style={{ color: C.navyText }}>{e.nombre}</span>
                    <span className="ml-auto text-[10px] uppercase" style={{ color: C.slateSoft }}>{e.tipo}</span>
                  </label>
                ))}
              </div>
            )}
            {selectedEntidades.length > 0 && (
              <div className="flex gap-1 flex-wrap mt-1.5 max-w-[280px]">
                {selectedEntidades.map((n) => (
                  <span key={n} className="flex items-center gap-1 text-[11px] px-2 py-0.5" style={{ background: C.line, color: C.navyText }}>
                    {n}
                    <X size={11} className="cursor-pointer" onClick={() => toggleEntidad(n)} />
                  </span>
                ))}
              </div>
            )}
          </div>

          {/* Modo de vista */}
          <div>
            <div className="flex items-center gap-1.5 mb-2 text-[11px] uppercase tracking-wide font-medium" style={{ color: C.slateSoft }}>
              <Gauge size={13} /> Modo de vista
            </div>
            <div className="flex border" style={{ borderColor: C.line }}>
              <button onClick={() => setViewMode("historico")} className="px-3 py-1.5 text-xs font-medium flex items-center gap-1.5"
                style={{ background: viewMode === "historico" ? C.navy : C.panel, color: viewMode === "historico" ? "#fff" : C.slate }}>
                <History size={13} /> Histórica
              </button>
              <button onClick={() => setViewMode("predictivo")} className="px-3 py-1.5 text-xs font-medium flex items-center gap-1.5 border-l"
                style={{ borderColor: C.line, background: viewMode === "predictivo" ? C.navy : C.panel, color: viewMode === "predictivo" ? "#fff" : C.slate }}>
                <LineChartIcon size={13} /> Proyección
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* TABS */}
      <div className=" border-b px-6 flex gap-1" style={{ background: C.panel, borderColor: C.line }}>
        <TabButton active={tab === "resumen"} onClick={() => setTab("resumen")} icon={LayoutGrid}>Resumen</TabButton>
        <TabButton active={tab === "historico"} onClick={() => setTab("historico")} icon={Activity}>Análisis Histórico</TabButton>
        <TabButton active={tab === "predictivo"} onClick={() => setTab("predictivo")} icon={SlidersHorizontal}>Modelo Predictivo</TabButton>
        <TabButton active={tab === "modelos"} onClick={() => setTab("modelos")} icon={Trophy}>Modelos de Predicción</TabButton>
        <TabButton active={tab === "prediccionSep"} onClick={() => setTab("prediccionSep")} icon={CalendarClock}>Predicción Setiembre</TabButton>
        <TabButton active={tab === "intervenidas"} onClick={() => setTab("intervenidas")} icon={ScrollText}>Entidades Intervenidas</TabButton>
      </div>

      <div className="p-6 max-w-[1400px] mx-auto">
        {/* ============ KPIs (siempre visibles arriba, excepto en Intervenidas) ============ */}
        {tab !== "intervenidas" && tab !== "prediccionSep" && (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <KPICard icon={Percent} label={viewMode === "predictivo" ? "Morosidad proyectada" : "Morosidad promedio"}
              value={kpi.morosidad.v.toFixed(2)} unit="%"
              delta={kpi.morosidad.v - kpi.morosidad.prev} deltaGood={kpi.morosidad.v <= kpi.morosidad.prev}
              tone={kpi.morosidad.v <= kpi.morosidad.prev ? C.emerald : C.crimson} />
            <KPICard icon={TrendingUp} label="Rentabilidad patrimonial (ROE)"
              value={kpi.roe.v.toFixed(2)} unit="%"
              delta={kpi.roe.v - kpi.roe.prev} deltaGood={kpi.roe.v >= kpi.roe.prev}
              tone={kpi.roe.v >= kpi.roe.prev ? C.emerald : C.crimson} />
            <KPICard icon={ShieldCheck} label="Ratio de Capital Global"
              value={kpi.capital.v.toFixed(2)} unit="%"
              delta={kpi.capital.v - kpi.capital.prev} deltaGood={kpi.capital.v >= kpi.capital.prev}
              tone={kpi.capital.v >= 14 ? C.emerald : C.amber} />
            <KPICard icon={CircleDollarSign} label="Créditos directos totales"
              value={fmtNum(kpi.creditos.v)} unit="S/ MM"
              delta={((kpi.creditos.v - kpi.creditos.prev) / (kpi.creditos.prev || 1)) * 100} deltaGood={kpi.creditos.v >= kpi.creditos.prev}
              tone={C.emerald} />
          </div>
        )}

        {/* ============ TAB: RESUMEN ============ */}
        {tab === "resumen" && (
          <div className="space-y-8">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 border p-5" style={{ background: C.panel, borderColor: C.line }}>
                <SectionTitle eyebrow="Serie del sistema" title="Morosidad y ROE — entidades seleccionadas" />
                <ResponsiveContainer width="100%" height={280}>
                  <LineChart data={lineSeries}>
                    <CartesianGrid stroke={C.line} vertical={false} />
                    <XAxis dataKey="year" tick={{ fontSize: 11, fill: C.slateSoft }} axisLine={{ stroke: C.line }} tickLine={false} />
                    <YAxis tick={{ fontSize: 11, fill: C.slateSoft }} axisLine={false} tickLine={false} width={35} />
                    <Tooltip content={<CustomTooltip suffix="%" />} />
                    <Legend wrapperStyle={{ fontSize: 11 }} />
                    {(selectedEntidades.length ? selectedEntidades : entidadesDisponibles.slice(0, 3).map((e) => e.nombre)).map((name, i) => (
                      <Line key={name} type="monotone" dataKey={name + "_morosidad"} name={`${name} · Morosidad`}
                        stroke={[C.crimson, C.navyText, C.gold, C.emerald, C.slate][i % 5]} strokeWidth={2} dot={false} />
                    ))}
                  </LineChart>
                </ResponsiveContainer>
              </div>

              <div className=" border p-5" style={{ background: C.panel, borderColor: C.line }}>
                <SectionTitle eyebrow="Cuota de mercado" title="Composición del sistema" />
                <ResponsiveContainer width="100%" height={280}>
                  <Treemap data={treemapData} dataKey="size" stroke={C.panel} fill={C.navyText}>
                    <Tooltip content={<CustomTooltip />} />
                  </Treemap>
                </ResponsiveContainer>
                <p className="text-[11px] mt-2" style={{ color: C.slateSoft }}>Tamaño proporcional a créditos directos ({lastYear}). Datos simulados.</p>
              </div>
            </div>

            <div className=" border p-5" style={{ background: C.panel, borderColor: C.line }}>
              <SectionTitle eyebrow="Solidez comparada" title="Créditos vs. Depósitos por entidad" />
              <ResponsiveContainer width="100%" height={300}>
                <BarChart data={barSeries}>
                  <CartesianGrid stroke={C.line} vertical={false} />
                  <XAxis dataKey="name" tick={{ fontSize: 11, fill: C.slateSoft }} axisLine={{ stroke: C.line }} tickLine={false} />
                  <YAxis tick={{ fontSize: 11, fill: C.slateSoft }} axisLine={false} tickLine={false} width={45} />
                  <Tooltip content={<CustomTooltip suffix=" MM" />} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  <Bar dataKey="creditos" name="Créditos directos (S/ MM)" fill={C.navyText} />
                  <Bar dataKey="depositos" name="Depósitos captados (S/ MM)" fill={C.gold} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        )}

        {/* ============ TAB: HISTORICO ============ */}
        {tab === "historico" && (
          <div className="space-y-8">
            <div className=" border p-5" style={{ background: C.panel, borderColor: C.line }}>
              <SectionTitle eyebrow="Evolución temporal" title="Morosidad por entidad seleccionada" />
              <ResponsiveContainer width="100%" height={300}>

                      className="w-full px-3 py-1.5 border text-sm" style={{ background: C.panel, borderColor: C.line, color: C.navyText }}>
                      <option value="TODOS">TODOS</option>
                      {predTiposDisponibles.map((t) => <option key={t} value={t}>{REAL_TIPO_LABEL[t] || t}</option>)}
                    </select>
                  </div>
                  <div className="min-w-[220px]">
                    <div className="text-[11px] uppercase tracking-wide font-medium mb-1" style={{ color: C.slateSoft }}>Entidad</div>
                    <select value={predEntidad} onChange={(e) => setPredEntidad(e.target.value)}
                      disabled={predTipoEntidad === "TODOS"}
                      className="w-full px-3 py-1.5 border text-sm" style={{
                        background: predTipoEntidad === "TODOS" ? C.chipBg : C.panel,
                        borderColor: C.line, color: predTipoEntidad === "TODOS" ? C.slateSoft : C.navyText,
                        cursor: predTipoEntidad === "TODOS" ? "not-allowed" : "pointer",
                      }}>
                      <option value="TODAS">TODAS</option>
                      {predEntidadesDisponibles.map((n) => <option key={n} value={n}>{n}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              <div className="overflow-auto max-h-[520px] border" style={{ borderColor: C.line }}>
                <table className="w-full text-xs">
                  <thead>
                    <tr style={{ background: C.navy }}>
                      <th className="text-left px-3 py-2 font-medium text-white sticky top-0" style={{ background: C.navy }}>Entidad</th>
                      <th className="text-left px-3 py-2 font-medium text-white sticky top-0" style={{ background: C.navy }}>Tipo</th>
                      {AGENCY_LIST.map((a) => (
                        <th key={a} className="text-center px-3 py-2 font-medium text-white sticky top-0" style={{ background: C.navy }}>{a}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {predPivot.map((fila, i) => (
                      <tr key={fila.ENTITY_NAME} style={{ background: i % 2 ? C.panelAlt : C.panel, borderTop: `1px solid ${C.line}` }}>
                        <td className="px-3 py-1.5 font-medium whitespace-nowrap" style={{ color: C.navyText }}>{fila.ENTITY_NAME}</td>
                        <td className="px-3 py-1.5" style={{ color: C.slateSoft }}>{REAL_TIPO_LABEL[fila.ENTITY_TYPE] || fila.ENTITY_TYPE}</td>
                        {AGENCY_LIST.map((a) => {
                          const p = fila.ecr[a.toUpperCase()];
                          if (!p) return <td key={a} className="text-center px-3 py-1.5" style={{ color: C.slateSoft }}>N/D</td>;
                          const toneAnt = realRatingTone(p.RATING_ANTERIOR);
                          const tonePred = realRatingTone(p.RATING_PREDICHO);
                          return (
                            <td key={a} className="text-center px-3 py-1.5 whitespace-nowrap">
                              <span className="inline-block px-1.5 py-0.5 mr-1" style={{ background: toneAnt.bg, color: toneAnt.fg }}>{p.RATING_ANTERIOR}</span>
                              <span style={{ color: C.slateSoft }}>→</span>
                              <span className="inline-block px-1.5 py-0.5 ml-1 font-semibold" style={{ background: tonePred.bg, color: tonePred.fg }}>{p.RATING_PREDICHO}</span>
                              {p.ALERTA_DOWNGRADE_FUERTE && <AlertTriangle size={11} color={C.crimson} className="inline ml-1 -mt-0.5" />}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                    {predPivot.length === 0 && (
                      <tr><td colSpan={2 + AGENCY_LIST.length} className="px-3 py-4 text-center" style={{ color: C.slateSoft }}>Sin resultados para el filtro seleccionado.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
              <p className="text-[11px] mt-2" style={{ color: C.slateSoft }}>
                "N/D" indica que esa ECR nunca calificó a la entidad (no hay clasificación anterior de la que partir), por lo que el motor no genera una predicción para esa combinación. Las 4 entidades con evento de intervención SBS confirmado (ver pestaña "Entidades Intervenidas") se excluyen de esta tabla — no se les proyecta un futuro.
              </p>
            </div>
          </div>
        )}

        {/* ============ TAB: INTERVENIDAS ============ */}
        {tab === "intervenidas" && (
          <div className="space-y-6">
            <div className="flex items-start gap-3 border p-4" style={{ background: C.panel, borderColor: C.line }}>
              <AlertTriangle size={18} color={C.amber} className="shrink-0 mt-0.5" />
              <p className="text-sm" style={{ color: C.slate }}>
                Registro real y curado de las entidades del sistema financiero peruano con evento de intervención SBS confirmado durante el periodo del panel (<code>motor/datos/eventos_intervencion.py</code>). Estas {REAL_EVENTOS_INTERVENCION.length} entidades se excluyen automáticamente de la predicción SEP2026 (no se les proyecta un futuro): ver pestaña "Predicción Setiembre".
              </p>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[11px] uppercase tracking-wide font-medium" style={{ color: C.slateSoft }}>Filtrar por tipo de evento:</span>
              <Chip active={causalFiltro === "todas"} onClick={() => setCausalFiltro("todas")}>Todas</Chip>
              {tiposEvento.map((t) => (
                <Chip key={t} active={causalFiltro === t} onClick={() => setCausalFiltro(t)}>{TIPO_EVENTO_LABEL[t] || t}</Chip>
              ))}
            </div>

            <div className=" border" style={{ background: C.panel, borderColor: C.line }}>
              {eventosFiltrados.map((item, i) => (
                <div key={item.ENTITY_NAME_NORM} className="p-5 flex flex-col md:flex-row gap-4" style={{ borderTop: i > 0 ? `1px solid ${C.line}` : "none" }}>
                  <div className="md:w-64 shrink-0">
                    <div className="text-[11px] uppercase tracking-wide font-medium" style={{ color: C.gold }}>{REAL_TIPO_LABEL[item.TIPO_ENTIDAD] || item.TIPO_ENTIDAD}</div>
                    <div className="text-base font-semibold" style={{ fontFamily: serif, color: C.navyText }}>{item.ENTITY_NAME_NORM}</div>
                    <div className="text-xs mt-1" style={{ color: C.slateSoft }}>Fecha del evento: {item.FECHA_EVENTO}</div>
                    <span className="inline-block mt-2 text-[10px] px-2 py-0.5 font-medium" style={{ background: C.amberSoft, color: C.amber }}>
                      {TIPO_EVENTO_LABEL[item.TIPO_EVENTO] || item.TIPO_EVENTO}
                    </span>
                  </div>
                  <div className="flex-1">
                    <div className="text-xs font-semibold mb-1" style={{ color: C.crimson }}>{item.RESOLUCION_SBS}</div>
                    <p className="text-sm mb-2" style={{ color: C.slate }}>{item.DESCRIPCION}</p>
                    <div className="text-xs" style={{ color: C.slateSoft }}>
                      <ScrollText size={12} className="inline mr-1 -mt-0.5" />Fuente: {item.FUENTE}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div className="border p-5" style={{ background: C.panel, borderColor: C.line }}>
              <div className="flex flex-wrap items-end justify-between gap-4 mb-3">
                <SectionTitle eyebrow="Historial de clasificación · datos reales (data/clasificaciones)" title="Evolución previa al evento de intervención" />
                <div className="min-w-[220px]">
                  <div className="text-[11px] uppercase tracking-wide font-medium mb-1" style={{ color: C.slateSoft }}>Entidad intervenida</div>
                  <select value={entidadIntervenidaSel || ""} onChange={(e) => setEntidadIntervenidaSel(e.target.value)}
                    className="w-full px-3 py-1.5 border text-sm" style={{ background: C.panel, borderColor: C.line, color: C.navyText }}>
                    {REAL_EVENTOS_INTERVENCION.map((e) => <option key={e.ENTITY_NAME_NORM} value={e.ENTITY_NAME_NORM}>{e.ENTITY_NAME_NORM}</option>)}
                  </select>
                </div>
              </div>

              {eventoSeleccionado && serieEventoSeleccionado.length > 0 ? (
                <>
                  <ResponsiveContainer width="100%" height={280}>
                    <LineChart data={serieEventoSeleccionado}>
                      <CartesianGrid stroke={C.line} vertical={false} />
                      <XAxis dataKey="corte" tick={{ fontSize: 11, fill: C.slateSoft }} axisLine={{ stroke: C.line }} tickLine={false} />
                      <YAxis reversed domain={[0, RATING_MASTER_SCALE_INT.length - 1]} ticks={RATING_MASTER_SCALE_INT.map((_, i) => i)}
                        tickFormatter={(v) => RATING_MASTER_SCALE_INT[v]} tick={{ fontSize: 11, fill: C.slateSoft }} axisLine={false} tickLine={false} width={35} />
                      <Tooltip formatter={(v, name) => [v == null ? "N/D" : RATING_MASTER_SCALE_INT[v], name]} />
                      <Legend wrapperStyle={{ fontSize: 11 }} />
                      {ecrsConHistorial.map((ecr) => (
                        <Line key={ecr} type="monotone" dataKey={ecr} name={ecr} stroke={ECR_LINE_COLOR[ecr] || C.navyText} strokeWidth={2} connectNulls dot={{ r: 3 }} />
                      ))}
                    </LineChart>
                  </ResponsiveContainer>
                  <p className="text-[11px] mt-2" style={{ color: C.slateSoft }}>
                    Cada punto es una calificación real reportada en los archivos de clasificación de la SBS (<code>data/clasificaciones/</code>) hasta el corte disponible más cercano al evento del {eventoSeleccionado.FECHA_EVENTO}. Escala: A+ (mejor) → E (peor); "N/D" = sin calificación vigente en ese corte.
                    {serieEventoSeleccionado.length === 1 && " Esta entidad solo cuenta con un corte con dato real en el histórico disponible del proyecto."}
                  </p>
                </>
              ) : (
                <div className="text-sm py-8 text-center" style={{ color: C.slateSoft }}>
                  Información no disponible: no se encontró ninguna fila para esta entidad en <code>data/clasificaciones/</code>. No se genera un gráfico para evitar mostrar datos no verificados.
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      <div className="px-6 py-4 text-center text-[11px]" style={{ color: C.slateSoft }}>
        Panel construido con fines demostrativos. En "Resumen", "Análisis Histórico" y "Modelo Predictivo", los indicadores de morosidad, ROE, ROA, capital global y cartera son simulaciones ilustrativas y no reemplazan los reportes oficiales de la SBS. Las pestañas "Modelos de Predicción", "Predicción Setiembre" y "Entidades Intervenidas" muestran, sin cálculos adicionales, la salida real del motor (<code>scripts/run_evaluacion.py</code>, <code>scripts/run_prediccion.py</code> y <code>motor/datos/eventos_intervencion.py</code>).
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SBSDashboard />);


</script>
</body>
</html>
